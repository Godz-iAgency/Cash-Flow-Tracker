<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F3F7F6">
  <title>Connect to open Cash Flow</title>
  <style>/* One clear-water appearance. All interface paint is defined here. */
:root {
  color-scheme: light;
  --canvas: #F3F7F6;
  --surface: #FFFFFF;
  --raised: #E9F1EF;
  --button: #145C57;
  --link: #145C57;
  --text: #142E2D;
  --muted: #48625F;
  --success: #14654F;
  --danger: #93451E;
  --coral: var(--danger);
  --button-text: #FFFFFF;
  --border: #D4E1DE;
  --focus: #145C57;
  --chrome: var(--canvas);
  --surface-glint: var(--surface);
  --hero-glow: #E5F1EE;
  --success-wash: #E2F0E9;
  --danger-wash: #F7ECE4;
  --hover: #E3EEEB;
  --button-hover: #104943;
  --wave: #C6E4DE;
  --wave-line: #D4E1DE;
  --shade: rgb(16 38 37 / 38%);
  --shadow: rgb(16 38 37 / 8%);
  --glow: transparent;
  --series-1: #145C57;
  --series-2: #48625F;
  --series-3: #14654F;
  --series-4: #93451E;
  --series-5: #527671;
  --series-6: #315E52;
  --green: var(--button);
  --accent: var(--success);
  --gold: var(--link);
  --warning: var(--link);
  /* A 96% pale backplate guarantees readable text even over black pixels. */
  --water-backplate: rgb(249 253 251 / 96%);
}
@media print { :root { --canvas: #FFFFFF; --surface: #FFFFFF; --raised: #E9F1EF; } }
</style>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;padding:24px;display:grid;place-items:center;background:var(--canvas);color:var(--text);font:16px/1.5 system-ui,sans-serif}
    main{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:32px;text-align:center}img{width:88px;height:88px;border-radius:22px}h1{font-size:26px;line-height:1.25;margin:24px 0 12px}p{color:var(--muted);margin:0 0 24px}a{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;background:var(--button);color:var(--button-text);text-decoration:none;font-weight:600;padding:12px 20px}a:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
  </style>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('cash-flow-appearance')==='light'?'light':'dark';document.querySelector('meta[name="theme-color"]').content=getComputedStyle(document.documentElement).getPropertyValue('--canvas').trim()}catch{}</script>
</head>
<body><main><img src="/icons/icon-192.png" alt="Cash Flow Tracker"><h1>Connect to open your tracker</h1><p>Connect to the internet to load and save your records.</p><a href="/">Try again</a></main></body>
</html>
