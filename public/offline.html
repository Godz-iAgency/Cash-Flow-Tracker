<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04121A">
  <title>Connect to open Cash Flow</title>
  <style>/* The entire water palette lives here. Edit these tokens to retune either mode. */
:root {
  color-scheme: dark;
  --canvas: #04121A;
  --surface: #0A2230;
  --raised: #0F2F40;
  --button: #4FD1C5;
  --link: #9BE7F0;
  --text: #E6F6F8;
  --muted: #8FB3BD;
  --success: #5EEAD4;
  --coral: #FF8A75;
  --danger: var(--coral);
  --button-text: var(--canvas);
  --border: color-mix(in srgb, var(--link) 14%, transparent);
  --focus: var(--link);
  --chrome: var(--canvas);
  --surface-glint: color-mix(in srgb, var(--surface) 96%, var(--text));
  --hero-glow: color-mix(in srgb, var(--surface) 85%, var(--button));
  --success-wash: color-mix(in srgb, var(--surface) 92%, var(--success));
  --danger-wash: color-mix(in srgb, var(--surface) 92%, var(--coral));
  --hover: color-mix(in srgb, var(--raised) 92%, var(--link));
  --button-hover: color-mix(in srgb, var(--button) 90%, var(--text));
  --wave: color-mix(in srgb, var(--button) 12%, transparent);
  --wave-line: color-mix(in srgb, var(--link) 22%, transparent);
  --shade: color-mix(in srgb, var(--canvas) 72%, transparent);
  --shadow: color-mix(in srgb, var(--canvas) 40%, transparent);
  --glow: color-mix(in srgb, var(--button) 6%, transparent);
  --series-1: var(--button);
  --series-2: var(--link);
  --series-3: var(--success);
  --series-4: var(--coral);
  --series-5: color-mix(in srgb, var(--link) 72%, var(--canvas));
  --series-6: color-mix(in srgb, var(--success) 70%, var(--canvas));
  /* Compatibility aliases keep finance components independent of the palette. */
  --green: var(--button);
  --accent: var(--success);
  --gold: var(--link);
  --warning: var(--link);
}
:root[data-theme='light'] {
  color-scheme: light;
  --canvas: #EAF7FA;
  --surface: #FFFFFF;
  --raised: #DCEEF4;
  --button: #0E9AA7;
  --link: #076E7B;
  --text: #0B2A36;
  --muted: #3E626E;
  --success: #08786B;
  /* Coral stays the warning paint; darker terracotta keeps warning text readable. */
  --danger: #A53E2D;
  --button-text: #04121A;
  --focus: var(--link);
  --border: color-mix(in srgb, var(--link) 15%, transparent);
  --surface-glint: var(--surface);
  --hero-glow: color-mix(in srgb, var(--surface) 82%, var(--raised));
  --success-wash: color-mix(in srgb, var(--surface) 93%, var(--success));
  --danger-wash: color-mix(in srgb, var(--surface) 85%, var(--coral));
  --hover: color-mix(in srgb, var(--raised) 95%, var(--link));
  --button-hover: color-mix(in srgb, var(--button) 94%, var(--text));
  --wave: color-mix(in srgb, var(--button) 10%, transparent);
  --wave-line: color-mix(in srgb, var(--link) 16%, transparent);
  --shade: color-mix(in srgb, var(--text) 25%, transparent);
  --shadow: color-mix(in srgb, var(--text) 9%, transparent);
  --glow: color-mix(in srgb, var(--button) 7%, transparent);
}
@media print {
  :root { --canvas: #FFFFFF; --surface: #FFFFFF; --raised: #DCEEF4; --text: #0B2A36; --muted: #3E626E; --link: #076E7B; --success: #08786B; --danger: #A53E2D; --surface-glint: var(--surface); --hero-glow: var(--surface); }
}
</style>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;padding:24px;display:grid;place-items:center;background:var(--canvas);color:var(--text);font:16px/1.5 system-ui,sans-serif}
    main{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:32px;text-align:center}img{width:88px;height:88px;border-radius:22px}h1{font-size:26px;line-height:1.25;margin:24px 0 12px}p{color:var(--muted);margin:0 0 24px}a{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:999px;background:var(--button);color:var(--button-text);text-decoration:none;font-weight:600;padding:12px 20px}a:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
  </style>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('cash-flow-appearance')==='light'?'light':'dark';document.querySelector('meta[name="theme-color"]').content=getComputedStyle(document.documentElement).getPropertyValue('--canvas').trim()}catch{}</script>
</head>
<body><main><img src="/icons/icon-192.png" alt="Cash Flow Tracker"><h1>Connect to open your tracker</h1><p>Connect to the internet to load and save your records.</p><a href="/">Try again</a></main></body>
</html>
